    notes: >-
      The standard English dictionary of Talmudic Aramaic and Hebrew, used widely in yeshivos
      and by English-speaking learners. Its author was not Orthodox: he is generally counted
      among the founders of what became Conservative Judaism (reviewers confirm). Proposed for
      word meanings only, never as a source for history or belief, with the Aruch, Rashi and
      Targum preferred wherever they differ. The board decides (founding spec, open question 13).

