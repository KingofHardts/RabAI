          The London 1903 printing, digitized in Sefaria's dictionary data. Public domain by age.
          In the private testing library as a word tool only (Josh, 2026-10-06): RabAI may use it
          for what a word means, never for history or belief.
        word_tool_only: true
        sefaria_lexicon:
          name: "Jastrow Dictionary"
          license: "Public Domain"
