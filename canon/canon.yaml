# The approved library — v0.1 draft.
#
# Nothing here is approved yet. "draft" = on the founding list. "proposed" = suggested
# addition. Only the rabbinic board moves a work to "approved", and records who approved it
# and when (approved_by, approved_on).
#
# A work enters retrieval only when the work is approved AND at least one of its editions is
# approved with license "cleared". tools/validate.py prints that whitelist.
#
# Editions: list the specific editions and translations allowed. "orthodox" is true, false,
# or "review" (the board should confirm). License values are in vocabulary.yaml. Every
# license below is a starting point for checking, not a conclusion. See docs/licensing.md.
#
# Tag values must come from canon/vocabulary.yaml.

