# Editions, translations and collections that stay OUT of the library by default.
#
# "Out of the library" means the assistant never quotes them as authority and they are never
# indexed for retrieval. The assistant may still DESCRIBE the views of their authors or
# movements as other positions (founding spec, layer 4).
#
# Each entry says why it is excluded and whether the board could reconsider it.
# Several of these are hosted on Sefaria next to Orthodox editions. They are the reason the
# library whitelists editions instead of importing whole collections.
# Before acting on any entry, check which edition Sefaria (or any source) currently serves.

excluded:

  - id: jps-1917
    title: The Holy Scriptures (JPS, 1917)
    reason: >-
      Not an Orthodox translation. Produced by a non-denominational scholarly committee.
      Public domain, which makes it easy to import by mistake.
    board_may_reconsider: true
    notes: Open question 2 in the founding spec covers public-domain translations like this one.
    sefaria_versions:
      - "The Holy Scriptures: A New Translation (JPS 1917)"
      - "Modernized Tanakh - Based on JPS 1917, Edited by Adam Cohn"

  - id: njps-1985
    title: Tanakh, The Holy Scriptures (New JPS translation, 1985)
    reason: Not an Orthodox translation.
    board_may_reconsider: false
    sefaria_versions:
      - "Tanakh: The Holy Scriptures, published by JPS"

  - id: contemporary-torah
    title: The Contemporary Torah (JPS, 2006)
    reason: A gender-sensitive adaptation of the 1985 JPS translation. Not an Orthodox translation.
    board_may_reconsider: false
    sefaria_versions:
      - "THE JPS TANAKH: Gender-Sensitive Edition"
      - "The Contemporary Torah, Jewish Publication Society, 2006"

  - id: mishnah-yomit-kulp
    title: Mishnah Yomit, translated by Dr. Joshua Kulp
    reason: >-
      The translator teaches at the Conservative Yeshiva in Jerusalem. On Sefaria this has
      been the default English Mishnah, so it gets pulled in by any whole-collection import.
      Confirm the current default before ingesting any Mishnah translation.
    board_may_reconsider: false
    sefaria_versions:
      - "Mishnah Yomit by Dr. Joshua Kulp"
      - "Mishna Yomit"

  - id: mesillat-yesharim-kaplan-1936
    title: Mesillat Yesharim, translated by Mordecai M. Kaplan (JPS, 1936)
    reason: >-
      The translator founded Reconstructionist Judaism. Approve an Orthodox translation of
      Mesillat Yesharim instead (see canon.yaml, ramchal).
    board_may_reconsider: false

  - id: rav-kook-bokser
    title: Translations of Rav Kook by Ben Zion Bokser (Paulist Press)
    reason: >-
      The translator was a Conservative rabbi. Use Orthodox translations, such as those by
      Rabbi Bezalel Naor.
    board_may_reconsider: false

  - id: yale-judaica-mishneh-torah
    title: The Code of Maimonides (Yale Judaica Series)
    reason: >-
      An academic series with translators of mixed affiliation. Excluded as a whole.
    board_may_reconsider: true
    notes: The board may approve individual volumes by Orthodox translators.

  - id: hirschfeld-kuzari-1905
    title: The Kuzari, translated by Hartwig Hirschfeld (1905)
    reason: >-
      An academic translation. Public domain. Excluded until the board decides on older
      translations by non-Orthodox translators.
    board_may_reconsider: true
    sefaria_versions:
      - "Kitab al Khazari, translated by Hartwig Hirschfeld, 1905"

  - id: sefaria-source-sheets
    title: User-created source sheets (Sefaria and similar sites)
    reason: >-
      Written by anyone, with no review. They often mix sources from every movement.
      Never index them.
    board_may_reconsider: false

  - id: non-orthodox-commentaries
    title: Non-Orthodox Chumashim and commentaries (for example, Etz Hayim and the Plaut Torah commentary)
    reason: Not Orthodox. Their views may be described as other positions, never cited as authority.
    board_may_reconsider: false

  - id: academic-biblical-scholarship
    title: Academic biblical and Talmudic scholarship (for example, Documentary Hypothesis literature)
    reason: >-
      Not a source of authority. The assistant may describe these theories accurately,
      labeled as academic theories, and present Orthodox responses to them.
    board_may_reconsider: false

  # The entries below were added while mapping canon editions to exact Sefaria versions
  # (2026-10-06). Version names are as Sefaria lists them.

  - id: sefaria-community-translation
    title: Sefaria Community Translation (and other unattributed volunteer translations)
    reason: >-
      Written by volunteers with no named translator and no review, so nobody can say whose
      understanding of the text it carries. The private testing library never uses it.
    board_may_reconsider: false
    sefaria_versions:
      - "Sefaria Community Translation"
      - "Sefaria Translation"
      - "Sefaria translation"

  - id: machine-translations
    title: Machine translations (AI and automatic translation tools)
    reason: >-
      Written by a computer, not by a translator from inside the tradition. A model must
      never learn Torah from another model's guesses.
    board_may_reconsider: true
    notes: >-
      Some are edited by a person (for example the 2026 Kli Yakar, made with Claude and
      edited by Rabbi Francis Nataf). The board may look at those one at a time.
    sefaria_versions:
      - "Sefaria Kli Yakar, 2026 Claude 3.7, ed. Francis Nataf ✧"
      - "AI version"
      - "automated translation"
      - "Le Talmud de Jérusalem, Moïse Schwab, 1871. converted via DeepL"
      - "Yad Hachasakah, based on L. Mandelstamm,1851 German translation. Translated by DeepL"
      - "Google Translate"
      - "ChatGPT"
      - "OpenAI, 2024"
      - "Open Torah Ai"
      - "AI Pardes"
      - "Beer Hagolah, Maharal, translated using AI"
      - "Marahal Beer Hagola with help from AI"
      - "Espanto Traducción por AI adaptación Jaim Yoel ben Avraham "

  - id: conservative-yeshiva-translations
    title: Translations from the Conservative Yeshiva (Daf Shevui and others)
    reason: Not Orthodox. Produced by a Conservative institution.
    board_may_reconsider: false
    sefaria_versions:
      - "Daf Shevui"
      - "Daf Shevui - 2"
      - "Conservative Yeshiva, Rabbi Mordechai Silverstein"
      - "Rabbi Mordechai Silverstein"

  - id: orchot-tzaddikim-cohen
    title: Orchot Tzaddikim, translated by Seymour J. Cohen (Ktav, 1982)
    reason: The translator was a Conservative rabbi. Approve an Orthodox translation instead.
    board_may_reconsider: false
    sefaria_versions:
      - "Orchot Tzaddikim, trans. Seymour J. Cohen, Ktav Pub House, 1982"
      - "Orchot Tzaddikim, trans. Seymour J. Cohen [with corrections]"

  - id: sifre-finkelstein-jts
    title: Sifre on Deuteronomy, edited by Louis Finkelstein (JTS, 1969)
    reason: >-
      An academic critical edition from the Jewish Theological Seminary (Conservative). The
      library uses a traditional text of the Sifrei instead.
    board_may_reconsider: true
    sefaria_versions:
      - "Sifre on Deuteronomy, ed. Dr. Louis Finkelstein. JTS, 1969"

  - id: academic-translations-of-midrash-and-targum
    title: Academic translations of Midrash and Targum by scholars outside the tradition
    reason: >-
      Translations by Christian clergy and university scholars (for example J. W. Etheridge,
      John T. Townsend, Eveline van Staalduine-Sulman, Martin Jaffee). Their notes and choices
      are not from inside the mesorah.
    board_may_reconsider: true
    sefaria_versions:
      - "The Targum of Jonathan ben Uzziel, trans. J. W. Etheridge, London, 1862"
      - "Midrash Tanhuma, S. Buber Recension; trans. by John T. Townsend, 1989."
      - "Townsend 1989 translation of Midrash Tanhuma, S. Buber Recension, edited and supplemented by R. Francis Nataf"
      - "The Targum of Samuel; trans. E. van Staalduine-Sulman. Leiden: Brill, 2002"
      - "Trans. by Marty Jaffee, 2015"

  - id: reform-seminary-translations
    title: Translations from Reform seminaries (for example HUC theses)
    reason: Not Orthodox.
    board_may_reconsider: false
    sefaria_versions:
      - "Hilkhot Yom ha-Kippurim, trans. by Jan M. Brahms. HUC, 1976"
      - "Hilchot Kidushin, trans. by Steven H. Garten. HUC, 1975"
      - "Hupah veKiddushin, trans. by Norman T. Roman. HUC, 1975"
      - "Samson H. Levey, Hebrew Union College, 1934"

  - id: kabbalah-and-ecology
    title: Translations from Kabbalah and Ecology by Rabbi Dr. David Mevorach Seidenberg
    reason: Written from outside the Orthodox world, with its own theological program.
    board_may_reconsider: false
    sefaria_versions:
      - "Rabbi Dr. David Mevorach Seidenberg, from Kabbalah and Ecology"

  - id: rodkinson-talmud
    title: The Babylonian Talmud, translated by Michael L. Rodkinson
    reason: >-
      An abridged, rearranged translation by a translator who broke with the tradition. Not a
      faithful translation of the Gemara.
    board_may_reconsider: false
    sefaria_versions:
      - "Rodkinson"
      - "Rodkinson Talmud"

  # The entries below name translations found while comparing the library with Mercava's
  # catalog (docs/library-comparison.md, questions 11 and 13; 2026-10-07). "Library question
  # N" below means question N there. Version names are as Sefaria lists them. Our builder only
  # uses versions the canon lists, so none of these could enter by accident; listing them
  # writes the intent down.

  - id: sefer-hayashar-cohen
    title: Sefer HaYashar, translated by Seymour J. Cohen (1973)
    reason: The translator was a Conservative rabbi (see orchot-tzaddikim-cohen).
    board_may_reconsider: false
    sefaria_versions:
      - "Sefer Hayashar, trans. Seymour J. Cohen. 1973."

  - id: sefer-yetzirah-kalisch
    title: Sefer Yetzirah, translated by Isidor Kalisch (New York, 1877)
    reason: The translator was a Reform rabbi. Public domain, which makes it easy to import by mistake.
    board_may_reconsider: false
    sefaria_versions:
      - "Sefer Yezirah, trans. by Isidor Kalisch. New York, 1877"

  - id: siddur-sim-shalom
    title: Siddur Sim Shalom
    reason: The Conservative movement's siddur. Its text and translation are not Orthodox.
    board_may_reconsider: false
    sefaria_versions:
      - "Siddur Sim Shalom"

  - id: conservative-and-egalitarian-responsa
    title: Responsa and translations from Conservative and egalitarian institutions (Rabbi David Golinkin, Hadar)
    reason: >-
      Not Orthodox. Sefaria places them beside the Mishneh Torah and Shulchan Arukh
      commentaries and the minor tractates.
    board_may_reconsider: false
    sefaria_versions:
      - "responsum from rabbi Golinkin"
      - "Hadar Egalitarianism Tshuva"
      - "Rabbi Ethan Tucker's translation"

  - id: meszler-gifts-for-the-poor
    title: Gifts for the Poor (Mishneh Torah), translated by Joseph B. Meszler (2003)
    reason: As far as we know the translator is a Reform rabbi.
    board_may_reconsider: true
    notes: To confirm. If he is not, the board can look at the translation like any other.
    sefaria_versions:
      - "Gifts for the Poor, Trans. by Joseph B. Meszler, Williamsburg, Virginia, 2003"

  - id: mccaul-radak
    title: The "McCaul Translation" of Radak on Zechariah
    reason: >-
      Probably by Alexander McCaul, a Christian missionary, whose translation served his
      argument with Judaism.
    board_may_reconsider: true
    notes: To confirm who the translator is.
    sefaria_versions:
      - "McCaul Translation"

  - id: academic-translations-other
    title: Academic translations of Heikhalot, the minor tractates, Megillat Ta'anit, the Mekhilta and others
    reason: >-
      Translations by university scholars outside the tradition (Morton Smith and Gershom
      Scholem, James Montgomery, Solomon Zeitlin, Jacob Lauterbach, Jonathan Brumberg-Kraus,
      Yitzhak Berger). Their notes and choices are not from inside the mesorah.
    board_may_reconsider: true
    notes: >-
      Yitzhak Berger's Hebrew critical edition of Radak on Chronicles is not listed here; it
      waits on library question 9 (scholars' editions).
    sefaria_versions:
      - "THE GREATER TREATISE CONCERNING THE PALACES OF HEAVEN, translated from the Hebrew and Aramaic by Morton Smith, corrected by Gershom Scholem, transcribed and edited with notes by Don Karr"
      - "Scholem, Gershom"
      - "James Montgomery (1907)"
      - "James Montogmery (1907)"
      - "Megillat Taanit, trans. Solomon Zeitlin"
      - "Lauterbach"
      - "Shulhan Shel Arba, translated by Jonathan Brumberg-Kraus, 2010"
      - "The Commentary of Radak to Chronicles: A Translation with Introduction and Supercommentary, by Yitzhak Berger, Brown University, 2007"

  - id: keter-malkhut-zangwill
    title: Keter Malkhut, translated by Israel Zangwill (JPS, 1923)
    reason: A literary translation by a writer outside the tradition.
    board_may_reconsider: true
    sefaria_versions:
      - "Selected Religious Poems of Solomon Ibn Gabirol, trans. Israel Zangwill. JPS, Philadelphia, 1923"

  - id: ramban-letter-schechter
    title: The Ramban's letter to his son, as edited and translated by Solomon Schechter (Jewish Quarterly Review, 1892)
    reason: >-
      Edited and translated by Solomon Schechter, who later led the Jewish Theological
      Seminary (Conservative). Sefaria uses the same version name for his Hebrew text and his
      English, so this bars both.
    board_may_reconsider: true
    notes: >-
      The board may prefer a traditional printing; see also Iggeret HaRamban in
      canon.yaml.
    sefaria_versions:
      - "Jewish Quaterly Review, 1892, Solomon Schechter"

  - id: unattributed-translations
    title: Translations that name no translator (Sefaria Responsa Anthology, Wikisource English)
    reason: >-
      Nobody can say whose understanding of the text they carry, like the Sefaria Community
      Translation.
    board_may_reconsider: true
    notes: >-
      Suggested in library question 13. "Iggeret HaGra -- Wikisource" is not listed
      because Sefaria uses the same name for the Hebrew text; the canon lists only the Hebrew.
      "The Sefaria Midrash Rabbah, 2022" also names no translator; the canon holds it for review.
    sefaria_versions:
      - "Sefaria Responsa Anthology"
      - "Responsa Responsa Anthology"
      - "Tales of Rabbi Nachman -- Wikisource"
      - "Tikkun HaKlali - Wikisource "
      - "Ben Ish Chai  by Yosef Chayim, translated by Wikisource"

  # The entries below come from the license pass of 2026-10-07 (library question 12: English
  # translators the board doesn't know). Each was checked against public sources, and each
  # reason gives the evidence found. Version names are exactly as Sefaria lists them.

  - id: greenspan-translations
    title: Translations by Rabbi Mark B. Greenspan (Haggadah commentaries, Abudarham, Nachal Eshkol and others)
    reason: >-
      The translator is a Conservative rabbi; he led the Oceanside Jewish Center, a
      Conservative congregation, from 1997 to 2024.
    board_may_reconsider: false
    sefaria_versions:
      - "Rabbi Mark Greenspan"
      - "Rabbi Mark B Greenspan"
      - "Rabbi Mark Greenspan, 2021"
      - "Rabbi Mark Greenspan, 2022"
      - "Rabbi Mark Greenspan, 2023"
      - "Midrash BeChiddush, translated by Rabbi Mark B. Greenspan, Oceanside, N.Y. 2024"
      - "Peirush Hafla'ah on Pesach Haggadah, translated and interpreted by Rabbi Mark B. Greenspan, Oceanside, NY, 2010"
      - "Zevach Pesach, translated by Rabbi Mark B. Greenspan, Oceanside, N.Y. 2019"

  - id: alpert-translations
    title: Translations by Rabbi Robert Alpert (Bartenura on the Mishnah, the Rambam on the Mishnah)
    reason: >-
      Not Orthodox: Sefaria itself names him a Conservative rabbi in one version title, and he
      teaches at the Academy for Jewish Religion, a non-Orthodox seminary.
    board_may_reconsider: false
    notes: >-
      One more version, "Bartenura on Mishnah, trans. by Rabbi Robert Alpert, 2020" with a
      non-breaking space after "Rabbi", is barred by the first name below, since names are
      compared without spaces or punctuation.
    sefaria_versions:
      - "Bartenura on Mishnah, trans. by Rabbi Robert Alpert, 2020"
      - "Bartenura on Mishnah, trans. by Rabbi Robert Alpert, 2022"
      - "Bartenura on Mishnah, trans. by Rabbi Robert Alpert (Conservative), 2020"
      - "Translation by Rabbi Robert Alpert, 2023"

  - id: gorfinkle-translations
    title: Joseph I. Gorfinkle's editions (the Eight Chapters, 1912; Pirkei Avot, 1913)
    reason: >-
      The editor studied at Hebrew Union College (Reform) and was rabbi of Sinai Temple in
      Mount Vernon, New York. Public domain, which makes it easy to import by mistake.
    board_may_reconsider: true
    notes: >-
      Sefaria uses the Eight Chapters version name for both his Hebrew text and his English,
      so this bars both. The canon's Eight Chapters uses the Wikisource Hebrew instead.
    sefaria_versions:
      - "The Eight Chapters of Maimonides on Ethics, by Joseph I Gorfinkle"
      - "The Saying of the Jewish Fathers: Gorfinkle 1913"

  - id: sefer-hayirah-kerber
    title: Sefer HaYirah, translated by Rabbi Justin S. Kerber (2007)
    reason: >-
      As far as we know the translator is rabbi of B'nai Sholom in Quincy, Illinois, a Reform
      congregation.
    board_may_reconsider: true
    notes: To confirm that this is the same Rabbi Justin Kerber.
    sefaria_versions:
      - "Sefer ha-Yirah, trans. Rabbi Justin S. Kerber, 2007"

  - id: tzav-vezeruz-glazer
    title: Tzav VeZeruz (the Piaseczno Rebbe), translated by Aubrey Glazer (2025)
    reason: The translator received his rabbinic ordination from the Jewish Theological Seminary (Conservative).
    board_may_reconsider: false
    sefaria_versions:
      - "Tzav veZiruz translation by Aubrey Glazer, 2025"
