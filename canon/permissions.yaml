# Written permissions from rights holders.
#
# For a text on Sefaria whose files carry no open license, a version in canon.yaml names the
# permission with `permission: <id>`. Its `license` stays the one Sefaria shows on its other
# titles, or is "Permission" when Sefaria shows none. The build accepts such a file only when the
# file's Sefaria source is one of the holder's `sites` (or a version listed under `also`), and
# records its license as "Permission (<holder>, <received>)" (tools/library_plan.py).
#
# For a source's own site (Aish.com, Chabad.org), the permission is recorded here first. Its
# content still comes in edition by edition, each listed in canon.yaml for the board, never the
# whole site at once.
#
# A permission here lets a text into the private testing library. It is not a board approval:
# the board still decides what is Torah content, and an edition still needs `license: cleared`
# (with the permission's own words on file) before it can be public. `public: false` means the
# holder allows private use only: tools/validate.py then refuses `license: cleared` on any
# edition that rests on it, and the app never opens the testing library once it is public
# (web/lib/library/index.ts).
#
# Only the maintainer records a permission, as he received it.

permissions:

  - id: torat-emet
    holder: "Torat Emet"
    sites: [toratemetfreeware.com, ateret4u.com]
    received: 2026-10-10
    how: >-
      By email to the maintainer, who reported it in a working session on 2026-10-10 ("[Torat]
      Emet sent me an email saying it's ok"). The email itself is not yet in this repo; forward
      it or copy its words into docs/permissions-plan.md, so its exact terms are on file.
    public: false
    scope: >-
      Complete access to their texts, for private use only: not to be used publicly for now (the
      maintainer's account of their reply, 2026-10-10). That covers the private testing library;
      a public launch needs their further permission. What we asked for is in
      docs/permissions-plan.md ("Torat Emet"), including their vocalized Zohar ("Zohar Menukad").
      ateret4u.com appears to be Torat Emet's library online: Sefaria names its files as Torat
      Emet's, and they use the same numbering (f_NNNNN) (to confirm).
    also:
      - version: "Vocalized Zohar, Israel 2013"
        why: >-
          Sefaria gives a National Library of Israel catalog record as this file's source, but
          its text is Torat Emet's vocalized Zohar ("Zohar Menukad", online file f_01148): its
          Idra Zuta matches Torat Emet's word for word (9,099 of 9,099 words), and it is the
          file we asked Torat Emet about. Who vocalized it, and whether Torat Emet holds its
          rights or distributes it by someone else's leave, is still to be confirmed.

  - id: aish
    holder: "Aish (Aish.com)"
    sites: [aish.com]
    received: 2026-10-10
    how: >-
      In writing, reported by the maintainer in a working session on 2026-10-10 ("I just got
      written oks of use for both of them", Aish.com and Chabad.org). The wording is not yet in
      this repo; copy it into docs/permissions-plan.md, so its exact terms are on file.
    public: false
    scope: >-
      Complete access to their content, for private use only: not to be used publicly for now
      (the maintainer's account of their reply, 2026-10-10). That covers the private testing
      library; a public launch needs their further permission. Articles by outside authors may
      need those authors' own permission before any public use.

  - id: chabad-org
    holder: "Chabad.org"
    sites: [chabad.org]
    received: 2026-10-10
    how: >-
      In writing, reported by the maintainer in a working session on 2026-10-10 (with Aish.com's).
      The wording is not yet in this repo; copy it into docs/permissions-plan.md, so its exact
      terms are on file.
    public: false
    scope: >-
      Complete access to their content, for private use only: not to be used publicly for now
      (the maintainer's account of their reply, 2026-10-10). That covers the private testing
      library; a public launch needs their further permission. Some texts on Chabad.org appear
      there by permission of their own publishers (for example, its Tanach translation is the
      Judaica Press edition and its Mishneh Torah translation is Moznaim's, to confirm); before
      any public use, those publishers' OK may be needed too.
