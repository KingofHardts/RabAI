# The order in which RabAI opens the commentaries printed around a text: the main ones first,
# the way a learner opens the books (Josh's direction, 2026-10-13: halacha answers should look at
# the right sources and their commentaries, the Shulchan Aruch above all; founding spec, "Reading
# a ruling the way a posek reads it"). A draft for the board, which decides which commentaries
# are named as the main ones for each part.
#
# For each kind of text, the commentaries printed with it, by rank:
#   main   opened first;
#   next   opened after the main ones;
#   later  opened after those and after the sources a ruling rests on.
# Within a rank, in the order given. Each book gives a line or two before the next book is
# opened, so one long commentary can't crowd out the others. A commentary not listed comes after
# these, and one on a different place (another siman or verse) is a cross-reference.
#
# On a code (the four parts of the Shulchan Aruch, the Mishneh Torah), the sources of the ruling
# come between `next` and `later`: the Gemara, the Rambam, the Tur and the Beit Yosef, the
# Yerushalmi and the Rif. On the Gemara, the codes that rule on the line (the Ein Mishpat: the
# Rambam, the Tur, the Shulchan Aruch) and the mishnah it explains come between `main` and
# `next`.
#
# Names are as the library names the books (Sefaria's titles). Where the library adds the part a
# commentary explains, so does this list: "Turei Zahav on Shulchan Arukh, Orach Chayim" is the
# Taz on Orach Chayim. On the Mishneh Torah, the Torah, Nach, the Mishnah and the Gemara, a name
# is the commentator's alone ("Ramban" for "Ramban on Genesis").
#
# After editing, run: python3 tools/validate.py --write
# (it regenerates web/lib/library/reading-order.generated.ts, which the app reads, and the
# sources list for the board, docs/sources-for-review.md).

status: proposed

# The name a learner calls a commentary by, for the list the board reads. Only where the
# library's name is not the one people use.
known_as:
  Turei Zahav: the Taz
  Siftei Kohen: the Shach
  "Me'irat Einayim": the Sma
  Beur HaGra: the Vilna Gaon's commentary
  "Hasagot HaRa'avad": "the Ra'avad's glosses"
  Chidushei Halachot: the Maharsha
  Chidushei Agadot: the Maharsha
  Haamek Davar: the Netziv
  Yachin: Tiferet Yisrael
  Boaz: Tiferet Yisrael
  Targum Jonathan: Targum Yonatan
  Kitzur Ba'al HaTurim: the Ba'al HaTurim

