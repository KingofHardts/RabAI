# Where to look for each canon work in Sefaria's table of contents.
# Used only by tools/sefaria_survey.py, which reports what Sefaria holds (titles, editions,
# translators, licenses, sizes) so that each canon edition can be mapped to an exact version.
# A match here means nothing about approval: the board and canon.yaml decide that.
#
# Each entry: canon id -> one or more of
#   re:   regular expression matched against the Sefaria title (case-insensitive)
#   root: the first Sefaria category the title must sit under
#   cat:  an exact category path the title must sit under
#   hint: a word to search titles for when nothing matches

tanakh:
  cat: [[Tanakh, Torah], [Tanakh, Prophets], [Tanakh, Writings]]
rashi-tanakh: {re: "^Rashi on ", root: Tanakh}
ramban-torah: {re: "^Ramban on (Genesis|Exodus|Leviticus|Numbers|Deuteronomy)$"}
ibn-ezra-tanakh: {re: "^Ibn Ezra on ", root: Tanakh}
sforno-torah: {re: "^Sforno on ", root: Tanakh}
ohr-hachaim-torah: {re: "^Or HaChaim on ", hint: Chaim}
malbim-tanakh: {re: "^Malbim on ", root: Tanakh}
mishnah: {re: "^Mishnah ", root: Mishnah}
talmud-bavli:
  cat: [[Talmud, Bavli, Seder Zeraim], [Talmud, Bavli, Seder Moed], [Talmud, Bavli, Seder Nashim],
        [Talmud, Bavli, Seder Nezikin], [Talmud, Bavli, Seder Kodashim], [Talmud, Bavli, Seder Tahorot]]
talmud-yerushalmi: {re: "^Jerusalem Talmud ", hint: Jerusalem Talmud}
midrash:
  re: "^((Bereshit|Shemot|Vayikra|Bamidbar|Devarim|Shir HaShirim|Ruth|Eichah|Kohelet|Esther) Rabbah|Midrash Tanchuma|Mekhilta|Sifra|Sifrei)"
rishonim-shas: {re: "^(Rashi|Tosafot|Ramban|Rashba|Ritva|Ran) on ", root: Talmud}
rif: {re: "^Rif ", hint: Rif}
rosh: {re: "^Rosh on ", hint: Rosh}
mishneh-torah: {re: "^Mishneh Torah, "}
tur: {re: "^Tur,", hint: Tur}
shulchan-aruch: {re: "^Shulchan Arukh, (Orach Chayim|Yoreh De'ah|Even HaEzer|Choshen Mishpat)$"}
