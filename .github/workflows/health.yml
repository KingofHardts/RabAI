name: Is RabbAI working?

# Checks every piece the app needs and writes what it found to the run's summary: Turso (plan,
# monthly limits, blocks, the databases), Vercel (the latest deploy, which settings exist), the
# settings used the way the app uses them (the databases answer, the Anthropic key works), and the
# live app (the lock page, the access code, the library list, the Sources page, the Gemara page, a
# word, seven real questions: one from the library, one about RabbAI's own sources, one with a
# picture, a dvar Torah on this week's parsha, one asked as if out loud in Talk, one whose page
# leaves halfway and comes back for the answer, one practical halacha question looked up online),
# and the app in a real browser on a phone and a computer (page errors, the Sources page's search,
# one more question, with the page reloaded while it is answered).
#
# Run it by hand: Actions, "Is RabbAI working?", Run workflow. It costs about as much as eight
# questions in the app. This repository is public, so its Actions logs are too: every value the run
# reads is masked before use, and the script prints no key, code, token or answer
# (tools/health_check.py).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no browser for the newer runner image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install a browser for the last step
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PW_PATH=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check every piece
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 tools/health_check.py
