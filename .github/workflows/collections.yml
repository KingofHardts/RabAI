name: Copy a website's sections (collections)

# Copies the website sections the canon lists for one written permission (canon/canon.yaml,
# editions with `site:`) into that site's own collection database on Turso,
# rabai-collection-<permission> (tools/collection_build.py). Run it by hand: Actions, "Copy a
# website's sections (collections)", Run workflow. Without "write", it is a trial into a
# throwaway file on the runner that prints only counts and sizes.
#
# Nothing is kept as an artifact, and nothing prints an article's text: this repository's logs
# are public, and the permissions are for private use only. Every token made here is masked.

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "Whose site (the permission in canon/permissions.yaml)"
        type: choice
        options: [aish]
        default: aish
      write:
        description: "Write to Turso (otherwise a trial that prints counts only)"
        type: boolean
        default: false
      limit:
        description: "Fetch at most this many articles per section (0: all). A trial with a limit estimates the whole size."
        type: number
        default: 0
      minutes:
        description: "Stop fetching after this many minutes; the next run continues where it stopped"
        type: number
        default: 165
      full:
        description: "Fetch every article again, not only new and changed ones"
        type: boolean
        default: false
      probe:
        description: "Only try the site's listing query in parts and print status codes (no copying)"
        type: boolean
        default: false
      inspect:
        description: "Only show where one section's posts keep their text, in the site's interface and on their own pages: names, lengths and counts, never words (a section's name, for example ask-the-rabbi)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: collections
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check the canon
        run: python3 tools/validate.py
      - name: Test the collection builder
        run: python3 -m unittest tools.tests.test_collections
      - name: Copy the sections
        env:
          COLLECTION: ${{ inputs.collection }}
          WRITE: ${{ inputs.write }}
          LIMIT: ${{ inputs.limit }}
          MINUTES: ${{ inputs.minutes }}
          FULL: ${{ inputs.full }}
          PROBE: ${{ inputs.probe }}
          INSPECT: ${{ inputs.inspect }}
          TURSO_API_TOKEN: ${{ inputs.write && secrets.TURSO_API_TOKEN || '' }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          VERCEL_TOKEN: ${{ inputs.write && secrets.VERCEL_TOKEN || '' }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          args=("$COLLECTION")
          if [ "$WRITE" = "true" ]; then args+=(--turso); else args+=(--out "$RUNNER_TEMP/collection.db"); fi
          if [ "$LIMIT" != "0" ]; then args+=(--limit "$LIMIT"); fi
          if [ "$MINUTES" != "0" ]; then args+=(--minutes "$MINUTES"); fi
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          if [ "$PROBE" = "true" ]; then args+=(--probe); fi
          if [ -n "$INSPECT" ]; then args+=(--inspect "$INSPECT"); fi
          python3 tools/collection_build.py "${args[@]}"
