name: Library survey

# Reports what Sefaria holds for each canon work (titles, editions, licenses, size).
# Metadata only. The development sandbox can't reach Sefaria, so this runs here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sefaria_survey.py
      - tools/sefaria_probe.yaml
      - .github/workflows/library-survey.yml

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/sefaria_survey.py
