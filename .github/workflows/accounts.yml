name: Accounts (the people database)

# Sets up the people database (web/lib/account/people.ts) for accounts and "Was this helpful?", and
# connects the app to it. Run it by hand: Actions, "Accounts (the people database)", Run workflow.
# It creates the database once, never deletes it, makes the app's key for email checks only if the
# app doesn't have one yet, and redeploys the app. It spends nothing.
#
# The mail service (RESEND_API_KEY, RABAI_MAIL_FROM) is set in Vercel by hand; see web/README.md,
# "Accounts". This repository is public, so its Actions logs are too: every token and key this run
# makes is masked before anything could print it, and none is ever echoed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounts
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the people database and connect the app
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: python3 tools/people_setup.py
