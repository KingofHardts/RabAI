name: Delete old Vercel deploys

# Each deploy Vercel keeps holds a copy of the app's server code, and they all count against the
# account's storage. This keeps the newest built production deploys (10 by default, so a bad deploy
# can be rolled back) and a few previews, and deletes the rest (tools/vercel_cleanup.py). It runs on
# its own every Sunday; by hand it is a trial unless "delete" is ticked. It prints counts and dates
# only.

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      keep:
        description: "Production deploys to keep (at least 3)"
        required: false
        default: "10"
      delete:
        description: "Delete them (otherwise a trial that only counts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete old deploys
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          KEEP: ${{ inputs.keep || '10' }}
          DELETE: ${{ github.event_name == 'schedule' && 'yes' || (inputs.delete && 'yes' || 'no') }}
        run: python3 tools/vercel_cleanup.py
